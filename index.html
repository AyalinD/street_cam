<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Street Camera</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            padding: 15px 20px;
            margin: 0;
        }

        .camera {
            width: 100%;
            max-width: 1200px;
            margin: auto;
        }

        iframe {
            width: 100%;
            height: 700px;
            border: none;
            display: block;
            background: black;
        }
    </style>
</head>

<body>

<h1>🔴 Live Street Camera</h1>

<div class="camera">
    <iframe
        id="camera"
        allow="autoplay"
        title="Live Street Camera">
    </iframe>
</div>

<script>
    document.getElementById("camera").src =
        "https://crimson-view.streetcam.workers.dev/";
</script>

</body>
</html>
